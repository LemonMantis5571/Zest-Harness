[package]
name = "zest-gpui-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: never joins Zest's workspace or touches the root Cargo.lock.
[workspace]

[dependencies]
# crates.io only has gpui 0.2.2 (2025-10-22) and no gpui_platform/gpui_windows, so pin Zed.
gpui = { git = "https://github.com/zed-industries/zed", rev = "7a349ce42df27b03c3ac16d478c88b8e1411607e", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7a349ce42df27b03c3ac16d478c88b8e1411607e" }

pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-segmentation = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.23"
tempfile = "3"
pdf-inspector = { git = "https://github.com/firecrawl/pdf-inspector", rev = "ef52f77850b29189048797a48b24862251f54fe7" }
image = { version = "0.25", default-features = false, features = ["png"] }

# Quick investigation: can a GPUI window host a wry child webview (raw window handle)?
wry = { version = "0.57", optional = true }

# Experiment 3: provider-neutral streaming types from Zest's core crate.
zest-core = { path = "../../crates/core" }
zest-coordinator = { path = "../../crates/coordinator" }

# Syntax pack from bat (TypeScript, TSX, TOML, Dockerfile, Kotlin, Swift, ...). Same regex backend as syntect above.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"], optional = true }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "7a349ce42df27b03c3ac16d478c88b8e1411607e", features = ["test-support"] }

[features]
default = ["core"]
core = []
webview = ["dep:wry"]
grammars = ["dep:two-face"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
debug = false
