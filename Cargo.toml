[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/desktop",
    "crates/plugin-api",
    "crates/plugins/now-playing",
    "crates/plugins/wallpaper",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "A local-first coding workspace with approvals, diffs, and optional model delegation."

[workspace.lints.rust]
linker_messages = "allow"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
dirs = "6"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
keyring = "3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "webpki-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "sync", "time", "process"] }
toml = "1"
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
