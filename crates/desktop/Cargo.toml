[package]
name = "zest-desktop"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace and Cargo.lock: GPUI is pinned to a Zed git revision whose
# dependency tree must not constrain the CLI and core crates.
[workspace]

[build-dependencies]
embed-resource = "3.0.11"

[dependencies]
accesskit = "0.24"
# crates.io only has gpui 0.2.2 (2025-10-22) and no gpui_platform/gpui_windows, so pin Zed.
gpui = { git = "https://github.com/zed-industries/zed", rev = "7a349ce42df27b03c3ac16d478c88b8e1411607e", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7a349ce42df27b03c3ac16d478c88b8e1411607e" }

pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-segmentation = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.23"
tempfile = "3"
dirs = "6"
zest-plugin-api = { path = "../plugin-api" }
pdf-inspector = { git = "https://github.com/firecrawl/pdf-inspector", rev = "ef52f77850b29189048797a48b24862251f54fe7" }
image = { version = "0.25", default-features = false, features = ["png"] }

# Isolated browser/HTML windows run their own platform event loop.
wry = "0.57"
tao = "0.37"
getrandom = "0.4"
url = "2"

# Experiment 3: provider-neutral streaming types from Zest's core crate.
zest-core = { path = "../core" }
zest-coordinator = { path = "../coordinator" }

# Syntax pack from bat (TypeScript, TSX, TOML, Dockerfile, Kotlin, Swift, ...). Same regex backend as syntect above.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"], optional = true }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "7a349ce42df27b03c3ac16d478c88b8e1411607e", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7a349ce42df27b03c3ac16d478c88b8e1411607e", features = ["wayland", "x11"] }

[features]
default = ["core"]
core = []
webview = []
grammars = ["dep:two-face"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
debug = false
