<!doctype html>
<html lang="en" class="dark" data-theme="zest">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/zest-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Paint the app's own background before any CSS or JS has loaded. Without
      this the webview shows a white frame on every launch, which is the first
      thing anyone sees. Hardcoded because `--background` lives in index.css,
      which is exactly what has not arrived yet; keep the two in step.

      `color-scheme` also stops the webview drawing light scrollbars and form
      controls during that same window.
    -->
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body {
        margin: 0;
        background: #0c0c0e;
      }
    </style>
    <script>
      (function () {
        try {
          var palettes = {
            oceanic: { dark: false, bg: "#eaf6ff" },
            nights: { dark: true, bg: "#12081c" },
          };
          var id = localStorage.getItem("zest.selected_theme");
          var palette = palettes[id];
          if (!palette) return;
          var root = document.documentElement;
          root.classList.toggle("dark", palette.dark);
          root.dataset.theme = id;
          var scheme = palette.dark ? "dark" : "light";
          root.style.colorScheme = scheme;
          root.style.background = palette.bg;
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute("content", scheme);
        } catch (e) {}
      })();
    </script>
    <title>Zest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
