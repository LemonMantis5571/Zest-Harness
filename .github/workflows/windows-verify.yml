name: Windows verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Windows full verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR output artifacts across commits
        if: github.event_name == 'pull_request'
        env:
          OUTPUT_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OUTPUT_POLICY_HEAD_SHA: ${{ github.sha }}
        run: node ./scripts/check-output-artifacts.mjs --range "$env:OUTPUT_POLICY_BASE_SHA" "$env:OUTPUT_POLICY_HEAD_SHA"

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Node 24.16.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Verify
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ZEST_CONTROL_ARTIFACTS: ${{ github.workspace }}/crates/desktop/ui/test-results/zest-control
        run: ./scripts/release-verify.ps1

      - name: Upload Playwright traces and control screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-windows
          path: crates/desktop/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
