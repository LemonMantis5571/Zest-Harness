name: Windows verify

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to a PR supersedes its in-flight run. Pushes to the default
# branch get a group of their own (the run id), so they are never cancelled and
# never collapse into a queue; they are the runs that seed the Rust cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Windows full verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR output artifacts across commits
        if: github.event_name == 'pull_request'
        env:
          OUTPUT_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OUTPUT_POLICY_HEAD_SHA: ${{ github.sha }}
        run: node ./scripts/check-output-artifacts.mjs --range "$env:OUTPUT_POLICY_BASE_SHA" "$env:OUTPUT_POLICY_HEAD_SHA"

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Node 24.16.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Use repository npm version
        run: npm install --global $(node -p "'npm@' + require('./package.json').engines.npm")

      # Only the default branch saves the Rust cache; PRs restore it. A cache
      # saved by a PR is visible to that PR alone, is over a gigabyte, and the
      # copies from a burst of PR runs evict the default branch's seed from the
      # 10 GB repository quota.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}

      # A checksum-verified prebuilt binary. Compiling it from source took 4 to
      # 6 minutes on every run that started with a cold cache.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Verify
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ZEST_CONTROL_ARTIFACTS: ${{ github.workspace }}/crates/desktop/ui/test-results/zest-control
        run: ./scripts/release-verify.ps1

      - name: Upload Playwright traces and control screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-windows
          path: crates/desktop/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
