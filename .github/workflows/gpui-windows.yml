name: Native GPUI

on:
  pull_request:
    paths:
      - 'spikes/gpui/**'
      - 'packaging/gpui/**'
      - 'scripts/package-gpui.mjs'
      - 'scripts/install-installer-tools.ps1'
      - 'crates/plugin-api/**'
      - 'crates/desktop/src/plugins.rs'
      - 'Cargo.toml'
      - 'crates/core/**'
      - 'crates/coordinator/**'
      - 'crates/desktop/src/attachments.rs'
      - 'crates/desktop/src/context_meter.rs'
      - 'crates/desktop/src/scratch_dir.rs'
      - 'crates/desktop/src/workspace_files.rs'
      - '.github/workflows/gpui-windows.yml'

concurrency:
  group: gpui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows:
    name: GPUI Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/gpui -> target
          save-if: false
      - name: Test native workspace, including offline agent and delegation flows
        timeout-minutes: 40
        shell: pwsh
        run: |
          cargo test --locked --release --manifest-path spikes/gpui/Cargo.toml -- --nocapture | Tee-Object -Variable testLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scenario in 'native_workspace', 'delegation_board') {
            if (-not ($testLog -match "^SELFTEST ${scenario}: PASS ")) { throw "Missing $scenario smoke result" }
          }
      - run: cargo build --locked --release --manifest-path spikes/gpui/Cargo.toml
      - name: Check UI Automation names and composer text
        run: |
          $app = Start-Process spikes/gpui/target/release/zest-gpui-spike.exe -ArgumentList '--demo' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline -and (Get-Process -Id $app.Id).MainWindowHandle -eq 0) { Start-Sleep -Milliseconds 250 }
            powershell -NoProfile -File spikes/gpui/benchmark/accessibility.ps1 -AppProcessId $app.Id -Check
            if ($LASTEXITCODE -ne 0) { throw 'The UI Automation check failed.' }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Install WiX 3 and NSIS
        shell: pwsh
        run: ./scripts/install-installer-tools.ps1
      - name: Build the Windows installers
        run: npm run gpui:package

  linux:
    name: GPUI Linux build, test and packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/gpui -> target
          save-if: false
      - name: Install GPUI and WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libssl-dev libdbus-1-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev libasound2-dev libvulkan1 \
            libwebkit2gtk-4.1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev dpkg-dev rpm squashfs-tools
      - run: cargo test --locked --release --manifest-path spikes/gpui/Cargo.toml
      - run: npm run gpui:package
