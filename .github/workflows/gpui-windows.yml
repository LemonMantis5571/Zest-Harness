name: Native GPUI

on:
  pull_request:
    paths:
      - 'spikes/gpui/**'
      - 'Cargo.toml'
      - 'crates/core/**'
      - 'crates/coordinator/**'
      - 'crates/desktop/src/attachments.rs'
      - 'crates/desktop/src/context_meter.rs'
      - 'crates/desktop/src/scratch_dir.rs'
      - 'crates/desktop/src/workspace_files.rs'
      - '.github/workflows/gpui-windows.yml'

concurrency:
  group: gpui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows:
    name: GPUI Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/gpui -> target
          save-if: false
      - name: Test native workspace, including offline agent and delegation flows
        timeout-minutes: 40
        shell: pwsh
        run: |
          cargo test --locked --release --manifest-path spikes/gpui/Cargo.toml -- --nocapture | Tee-Object -Variable testLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scenario in 'native_workspace', 'delegation_board') {
            if (-not ($testLog -match "^SELFTEST ${scenario}: PASS ")) { throw "Missing $scenario smoke result" }
          }
      - run: cargo build --locked --release --manifest-path spikes/gpui/Cargo.toml
