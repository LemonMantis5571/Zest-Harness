name: Linux verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 needs WebKitGTK and friends; keyring needs the Secret Service
      # (D-Bus) headers; aws-lc-rs needs cmake; AppImage bundling needs patchelf.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev cmake \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libxdo-dev \
            curl wget file tar patchelf libfuse2t64

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Node 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: npm ci
        run: npm ci --no-fund --no-audit

      - name: ts-rs binding drift
        shell: pwsh
        run: |
          cargo test -p zest-desktop --features export-bindings --lib export_bindings
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          foreach ($file in Get-ChildItem -Path crates/desktop/ui/src/lib/generated -Filter *.ts -File) {
            $text = [System.IO.File]::ReadAllText($file.FullName)
            $clean = $text -replace "`r`n", "`n"
            $clean = [regex]::Replace($clean, '(?m)[ \t]+$', '')
            if (-not $clean.EndsWith("`n")) { $clean += "`n" }
            if ($clean -ne $text) {
              [System.IO.File]::WriteAllText($file.FullName, $clean, $utf8NoBom)
            }
          }
          git diff --exit-code -- crates/desktop/ui/src/lib/generated

      - name: UI tests
        run: npm run ui:test

      - name: UI lint
        run: npm run ui:lint

      - name: UI build
        run: npm run ui:build

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets -- --nocapture

      - name: npm audit
        run: npm audit --omit=dev

      - name: cargo audit
        run: cargo audit

      - name: git diff whitespace check
        shell: pwsh
        run: |
          git diff --check --ignore-space-at-eol
          git diff --cached --check --ignore-space-at-eol
