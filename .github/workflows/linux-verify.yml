name: Linux verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 needs WebKitGTK and friends; keyring needs the Secret Service
      # (D-Bus) headers; aws-lc-rs needs cmake; AppImage bundling needs patchelf.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev cmake \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libxdo-dev \
            curl wget file tar patchelf libfuse2t64

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Node 24.16.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Verify
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bash scripts/release-verify.sh

  cli-headless:
    name: zest serve without WebKit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake \
            libdbus-1-dev curl wget file tar

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build and test the CLI daemon
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          if dpkg -s libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            echo "WebKitGTK must not be installed on this job" >&2
            exit 1
          fi
          cargo build -p zest
          cargo test -p zest-coordinator
          cargo test -p zest --test serve_e2e
          if cargo tree -p zest --edges normal | grep -Eiq 'webkit|zest-desktop'; then
            echo "zest must not depend on the desktop or WebKit" >&2
            cargo tree -p zest --edges normal >&2
            exit 1
          fi

