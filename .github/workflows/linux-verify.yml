name: Linux verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 needs WebKitGTK and friends; keyring needs the Secret Service
      # (D-Bus) headers; aws-lc-rs needs cmake; AppImage bundling needs patchelf.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev cmake \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libxdo-dev \
            curl wget file tar patchelf libfuse2t64

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Node 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # The same gate as Windows CI: the full release PowerShell gate under pwsh.
      - name: Verify
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: ./scripts/release-verify.ps1
